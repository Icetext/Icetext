<svg width="545" height="215" viewBox="0 0 545 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub streak statistics">
  <style>
    .number,.label,.range { font-family:'Segoe UI',Ubuntu,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif; text-anchor:middle; dominant-baseline:middle; }
    .number { font-size:28px; font-weight:700; fill:#cdd6f4; }
    .label { font-size:14px; font-weight:400; fill:#cdd6f4; }
    .range { font-size:12px; font-weight:400; fill:#cdd6f4; opacity:.9; }
    .current-number { fill:#cba6f7; }
    .current-label { fill:#cba6f7; font-weight:700; }
    .column { opacity:0; animation:fadeIn .5s ease-out forwards; }
    @keyframes fadeIn { to { opacity:1; } }
  </style>
  <rect x=".75" y=".75" width="543.5" height="213.5" rx="6" fill="#1e1e2e" stroke="#cdd6f4" stroke-width="1.5"/>
  <line x1="181.66666666666666" y1="30" x2="181.66666666666666" y2="187" stroke="#cdd6f4" stroke-width="1" opacity=".8"/>
  <line x1="363.3333333333333" y1="30" x2="363.3333333333333" y2="187" stroke="#cdd6f4" stroke-width="1" opacity=".8"/>
  <g class="column" style="animation-delay:120ms">
    <text x="90.83333333333333" y="78" class="number">84</text>
    <text x="90.83333333333333" y="118" class="label">Total Contributions</text>
    <text x="90.83333333333333" y="151" class="range">Aug 24, 2025 – Aug 28, 2026</text>
  </g>
  <g class="column" style="animation-delay:240ms">
    <circle cx="272.5" cy="75" r="43" fill="none" stroke="#94e2d5" stroke-width="5"/>
    <path d="M 272.5 23 C 264.5 32,262.5 40,272.5 44 C 281.5 40,280.5 31,274.5 26 C 275.5 32,271.5 35,269.5 32 C 268.5 29,270.5 26,272.5 23 Z" fill="#94e2d5" stroke="#1e1e2e" stroke-width="4"/>
    <text x="272.5" y="76" class="number current-number">2</text>
    <text x="272.5" y="145" class="label current-label">Current Streak</text>
    <text x="272.5" y="174" class="range">Aug 27, 2026 – Aug 28, 2026</text>
  </g>
  <g class="column" style="animation-delay:360ms">
    <text x="454.16666666666663" y="78" class="number">3</text>
    <text x="454.16666666666663" y="118" class="label">Longest Streak</text>
    <text x="454.16666666666663" y="151" class="range">Jun 30, 2026 – Jul 2, 2026</text>
  </g>
</svg>