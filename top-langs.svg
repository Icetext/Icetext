<svg
  width="495"
  height="215"
  viewBox="0 0 495 215"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Most Used Languages"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif, -apple-system;
      fill: #58a6ff;
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif, -apple-system;
      fill: #c9d1d9;
    }
    .lang-percent {
      font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif, -apple-system;
      fill: #58a6ff;
    }
    .bar-segment {
      opacity: 0;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    .stagger {
      opacity: 0;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="10"
    width="494"
    height="214"
    fill="#0d1117"
    stroke="#30363d"
    stroke-opacity="1"
  />

  <g transform="translate(25, 35)">
    <!-- Code Bracket Header Icon -->
    <svg fill="#58a6ff" height="20" viewBox="0 0 16 16" version="1.1" width="20" aria-hidden="true">
      <path fill-rule="evenodd" d="M4.72 3.22a.75.75 0 011.06 1.06L2.06 8l3.72 3.72a.75.75 0 11-1.06 1.06L.47 8.53a.75.75 0 010-1.06l4.25-4.25zm6.56 0a.75.75 0 10-1.06 1.06L13.94 8l-3.72 3.72a.75.75 0 101.06 1.06l4.25-4.25a.75.75 0 000-1.06l-4.25-4.25z"/>
    </svg>
    <text x="30" y="15" class="header">Most Used Languages</text>
  </g>

  
  <!-- Segmented Progress Bar -->
  <g>
    <defs>
      <clipPath id="bar-clip">
        <rect x="25" y="60" width="445" height="10" rx="5" />
      </clipPath>
    </defs>
    <!-- Background track -->
    <rect x="25" y="60" width="445" height="10" rx="5" fill="#30363d" opacity="0.4" />
    <g clip-path="url(#bar-clip)">
      <rect
        class="bar-segment"
        style="animation-delay: 200ms"
        x="25.00"
        y="60"
        width="214.05"
        height="10"
        fill="#3178c6"
      /><rect
        class="bar-segment"
        style="animation-delay: 280ms"
        x="239.05"
        y="60"
        width="153.08"
        height="10"
        fill="#f1e05a"
      /><rect
        class="bar-segment"
        style="animation-delay: 360ms"
        x="392.13"
        y="60"
        width="19.13"
        height="10"
        fill="#178600"
      /><rect
        class="bar-segment"
        style="animation-delay: 440ms"
        x="411.26"
        y="60"
        width="19.13"
        height="10"
        fill="#c6538c"
      /><rect
        class="bar-segment"
        style="animation-delay: 520ms"
        x="430.39"
        y="60"
        width="16.47"
        height="10"
        fill="#1d365d"
      /><rect
        class="bar-segment"
        style="animation-delay: 600ms"
        x="446.86"
        y="60"
        width="8.90"
        height="10"
        fill="#3572A5"
      />
    </g>
  </g>

  <!-- Language Grid -->
  <g>
    
      <g class="stagger" style="animation-delay: 300ms" transform="translate(25, 95)">
        <circle cx="6" cy="6" r="5" fill="#3178c6" />
        <text x="18" y="10" class="lang-name">TypeScript</text>
        <text x="207.5" y="10" text-anchor="end" class="lang-percent">48.1%</text>
      </g>
      <g class="stagger" style="animation-delay: 400ms" transform="translate(252.5, 95)">
        <circle cx="6" cy="6" r="5" fill="#f1e05a" />
        <text x="18" y="10" class="lang-name">JavaScript</text>
        <text x="207.5" y="10" text-anchor="end" class="lang-percent">34.4%</text>
      </g>
      <g class="stagger" style="animation-delay: 500ms" transform="translate(25, 125)">
        <circle cx="6" cy="6" r="5" fill="#178600" />
        <text x="18" y="10" class="lang-name">C#</text>
        <text x="207.5" y="10" text-anchor="end" class="lang-percent">4.3%</text>
      </g>
      <g class="stagger" style="animation-delay: 600ms" transform="translate(252.5, 125)">
        <circle cx="6" cy="6" r="5" fill="#c6538c" />
        <text x="18" y="10" class="lang-name">SCSS</text>
        <text x="207.5" y="10" text-anchor="end" class="lang-percent">4.3%</text>
      </g>
      <g class="stagger" style="animation-delay: 700ms" transform="translate(25, 155)">
        <circle cx="6" cy="6" r="5" fill="#1d365d" />
        <text x="18" y="10" class="lang-name">Less</text>
        <text x="207.5" y="10" text-anchor="end" class="lang-percent">3.7%</text>
      </g>
      <g class="stagger" style="animation-delay: 800ms" transform="translate(252.5, 155)">
        <circle cx="6" cy="6" r="5" fill="#3572A5" />
        <text x="18" y="10" class="lang-name">Python</text>
        <text x="207.5" y="10" text-anchor="end" class="lang-percent">2.0%</text>
      </g>
  </g>
  
</svg>