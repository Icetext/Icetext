    .language { font-size:11px; font-weight:400; fill:#cdd6f4; }
    .empty { font-size:12px; fill:#cdd6f4; text-anchor:middle; }
    .fade { opacity:0; animation:fadeIn .45s ease-out forwards; }
    @keyframes fadeIn { to { opacity:1; } }
