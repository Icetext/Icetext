<svg width="495" height="215" viewBox="0 0 495 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icetext&apos;s GitHub Stats">
  <style>
    .header,.stat-label,.stat-value,.rank { font-family:'Segoe UI',Ubuntu,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif; dominant-baseline:middle; }
    .header { font-size:18px; font-weight:600; fill:#94e2d5; }
    .stat-label,.stat-value { font-size:14px; font-weight:600; fill:#cdd6f4; }
    .rank { font-size:26px; font-weight:700; fill:#cdd6f4; text-anchor:middle; }
    .row { opacity:0; animation:fadeIn .45s ease-out forwards; }
    @keyframes fadeIn { to { opacity:1; } }
  </style>
  <rect x=".75" y=".75" width="493.5" height="213.5" rx="6" fill="#1e1e2e" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="27" y="34" class="header">Icetext&apos;s GitHub Stats</text>
  <g class="row" style="animation-delay:150ms">
      <text x="27" y="70" class="stat-label">Total Stars Earned:</text>
      <text x="247" y="70" class="stat-value">0</text>
    </g>
    <g class="row" style="animation-delay:230ms">
      <text x="27" y="97" class="stat-label">Total Commits:</text>
      <text x="247" y="97" class="stat-value">571</text>
    </g>
    <g class="row" style="animation-delay:310ms">
      <text x="27" y="124" class="stat-label">Total PRs:</text>
      <text x="247" y="124" class="stat-value">8</text>
    </g>
    <g class="row" style="animation-delay:390ms">
      <text x="27" y="151" class="stat-label">Total Issues:</text>
      <text x="247" y="151" class="stat-value">0</text>
    </g>
    <g class="row" style="animation-delay:470ms">
      <text x="27" y="178" class="stat-label">Contributed to (last year):</text>
      <text x="247" y="178" class="stat-value">14</text>
    </g>
  <g transform="translate(391,121)">
    <circle r="44" fill="none" stroke="#313244" stroke-width="7"/>
    <circle cy="-44" r="4" fill="#94e2d5"/>
    <text y="1" class="rank">A</text>
  </g>
</svg>